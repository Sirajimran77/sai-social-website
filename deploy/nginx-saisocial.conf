# nginx site config for saisocial.co.uk
#
# Install:
#   sudo cp deploy/nginx-saisocial.conf /etc/nginx/sites-available/saisocial
#   sudo ln -s /etc/nginx/sites-available/saisocial /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is HTTP-only on purpose. Run `sudo certbot --nginx -d saisocial.co.uk
# -d www.saisocial.co.uk` AFTER installing it — certbot rewrites this file in
# place, adding the :443 blocks, the certificate paths and the HTTP→HTTPS
# redirect. Do not hand-write TLS here first; certbot needs port 80 reachable to
# validate, and it will preserve everything below.

upstream sai_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Canonical host is www — SITE_ORIGIN, the canonical tags and the sitemap all
# say https://www.saisocial.co.uk. The apex must redirect, not serve a copy,
# or the site competes with itself in search.
server {
    listen 80;
    listen [::]:80;
    server_name saisocial.co.uk;
    return 308 https://www.saisocial.co.uk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.saisocial.co.uk;

    # Don't advertise the nginx version to scanners.
    server_tokens off;

    # The app caps request bodies at 32kb; reject anything larger at the edge.
    client_max_body_size 64k;

    # Compress text responses. The wall stills and showreel are already
    # compressed formats — gzipping them wastes CPU for nothing.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml text/markdown;

    # ACME challenge for certbot renewals (webroot mode).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://sai_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Host must be forwarded or Express sees "sai_app".
        proxy_set_header Host              $host;
        # express-rate-limit keys on req.ip, and the app runs with
        # `trust proxy = 1` — exactly one hop. $remote_addr (not
        # $proxy_add_x_forwarded_for) is what makes that hop honest: it drops
        # any X-Forwarded-For the client tried to forge.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Health check — kept out of the access log so it doesn't drown real traffic.
    location = /healthz {
        proxy_pass http://sai_app;
        proxy_set_header Host $host;
        access_log off;
    }
}
